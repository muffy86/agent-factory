name: Aider - Chat with Repo

on:
  repository_dispatch:
    types: [aider_task, agent_task]
  workflow_dispatch:
    inputs:
      task:
        description: 'What to do'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  aider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Aider
        run: pip install aider-install && aider-install
      - name: Run Aider
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          TASK="${{ github.event.client_payload.task || inputs.task }}"
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            aider --model sonnet --message "$TASK" --yes-always
          elif [ -n "$OPENAI_API_KEY" ]; then
            aider --model gpt-4o --message "$TASK" --yes-always
          else
            echo ":x: No LLM API key. Set ANTHROPIC_API_KEY or OPENAI_API_KEY in repo secrets."
            exit 1
          fi
      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          title: "aider: ${{ github.event.client_payload.task || inputs.task }}"
          body: ":robot: Generated by Aider via the agent-factory"
          branch: aider/${{ github.run_id }}
          commit-message: "aider: ${{ github.event.client_payload.task || inputs.task }}"
